<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrainPal Registration Test</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:24px}
.card{max-width:700px;margin:auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
h1{margin-top:0} .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px}
button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-weight:700}
pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:14px;border-radius:8px;margin-top:18px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
<h1>BrainPal Student Registration Test</h1>
<p>Local test page for the converted PHP API + Supabase PostgreSQL.</p>
<form id="form">
<div class="grid">
<div><label>First name</label><input id="firstName" required></div>
<div><label>Middle initial</label><input id="m_initial" placeholder="DC."></div>
<div><label>Last name</label><input id="lastName" required></div>
<div><label>Extension</label><input id="extension" placeholder="Jr."></div>
<div><label>Birthdate</label><input id="birthdate" type="date" required></div>
<div><label>Gender</label><select id="gender" required><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option></select></div>
<div><label>Email (use a NEW Gmail)</label><input id="email" type="email" required></div>
<div><label>Password</label><input id="password" type="password" required></div>
<div><label>Strand ID</label><input id="strand_id" type="number" value="4" required></div>
<div><label>Specialization ID (optional)</label><input id="specialization_id" type="number" placeholder="Leave blank if none"></div>
<div><label>Academic ID</label><input id="academic_id" type="number" value="1" required></div>
<div><label>Semester</label><select id="semester"><option value="1st">1st</option><option value="2nd">2nd</option></select></div>
</div>
<button id="btn">TEST REGISTRATION</button>
</form>
<pre id="result">Waiting for test...</pre>
</div>
<script>
const $=id=>document.getElementById(id);
$('form').addEventListener('submit',async e=>{
 e.preventDefault(); $('btn').disabled=true; $('result').textContent='Submitting...';
 const payload={
   firstName:$('firstName').value.trim(),
   m_initial:$('m_initial').value.trim(),
   lastName:$('lastName').value.trim(),
   extension:$('extension').value.trim(),
   birthdate:$('birthdate').value,
   gender:$('gender').value,
   email:$('email').value.trim(),
   password:$('password').value,
   strand_id:Number($('strand_id').value||0),
   specialization_id:$('specialization_id').value===''?null:Number($('specialization_id').value),
   academic_id:Number($('academic_id').value||0),
   semester:$('semester').value
 };
 try{
   const r=await fetch('./register/save-user.php',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});
   const t=await r.text(); let data; try{data=JSON.parse(t)}catch{data={raw:t}};
   $('result').textContent='HTTP '+r.status+'\n\n'+JSON.stringify(data,null,2);
 }catch(err){$('result').textContent='REQUEST FAILED\n\n'+err.message}
 finally{$('btn').disabled=false}
});
</script>
</body>
</html>
